[package]
name = "lact"
version = "0.10.1"
edition.workspace = true

[features]
default = ["lact-gui", "nvidia", "display-info"]
nvidia = ["lact-daemon/nvidia"]
display-info = ["lact-daemon/display-info"]
mock = ["lact-daemon/mock"]

[dependencies]
lact-daemon = { path = "../lact-daemon", default-features = false }
lact-schema = { path = "../lact-schema", features = ["args"] }
lact-cli = { path = "../lact-cli" }
lact-gui = { path = "../lact-gui", optional = true }
anyhow = { workspace = true }
libdisplay-info = { git = "https://github.com/ArthurHeymans/libdisplay-info-rs", branch = "support-libdisplay-info-0.4", version = "0.4.0" }
libdisplay-info-derive = { git = "https://github.com/ArthurHeymans/libdisplay-info-rs", branch = "support-libdisplay-info-0.4", version = "0.1.1" }

[dev-dependencies]
divan = { workspace = true }
lact-daemon = { path = "../lact-daemon", features = ["bench"] }
lact-gui = { path = "../lact-gui", features = ["bench"] }

[[bench]]
name = "bench"
harness = false
